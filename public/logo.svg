<svg width="512" height="512" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Obsidian Shield Container with Elevation Shadow -->
  <filter id="shieldShadow" x="4" y="4" width="112" height="116" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
    <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.25"/>
  </filter>

  <g filter="url(#shieldShadow)">
    <!-- Base Shield -->
    <path
      d="M60 10L18 24V54C18 78 36 99.5 60 106C84 99.5 102 78 102 54V24L60 10Z"
      fill="url(#obsidianGrad)"
      stroke="url(#borderGlow)"
      stroke-width="2.5"
      stroke-linejoin="round"
    />
  </g>

  <!-- High-Tech Internal Grid / Radar Arc Accents -->
  <path
    d="M32 46C32 63.5 44 79 60 84C76 79 88 63.5 88 46"
    stroke="#1E293B"
    stroke-width="1.5"
    stroke-dasharray="3 3"
  />

  <!-- The Veritas 'V' Multi-Dimensional Prism -->
  <!-- Left Wing (Linguistic NLP): Electric Azure to Royal Cobalt -->
  <path
    d="M34 32L60 76V56L44 30L34 32Z"
    fill="url(#blueWing)"
  />
  <path
    d="M34 32L44 30L60 56V64L34 32Z"
    fill="#60A5FA"
    fill-opacity="0.9"
  />

  <!-- Right Wing (Source Authority & Corroboration): Emerald to Cyan -->
  <path
    d="M86 32L60 76V56L76 30L86 32Z"
    fill="url(#emeraldWing)"
  />
  <path
    d="M86 32L76 30L60 56V64L86 32Z"
    fill="#34D399"
    fill-opacity="0.9"
  />

  <!-- Central Convergence Diamond / Focal Lens (Pure White Truth Core) -->
  <polygon
    points="60,20 69,33 60,44 51,33"
    fill="#FFFFFF"
  />
  <polygon
    points="60,24 65,33 60,40 55,33"
    fill="#0284C7"
  />
  <circle cx="60" cy="33" r="2" fill="#FFFFFF" />

  <!-- Gradients & Defs -->
  <defs>
    <!-- Deep Obsidian Shield Gradient -->
    <linearGradient id="obsidianGrad" x1="60" y1="10" x2="60" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Glow with Subtle Top Cyan/Blue Sheen -->
    <linearGradient id="borderGlow" x1="18" y1="10" x2="102" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#2563EB" />
      <stop offset="70%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Left Wing Gradient -->
    <linearGradient id="blueWing" x1="34" y1="30" x2="60" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Right Wing Gradient -->
    <linearGradient id="emeraldWing" x1="86" y1="30" x2="60" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
</svg>
